<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="description" content="AIBITDEV has moved to aibitdev.com — digital development studio." />
  <title>AIBITDEV — We've moved</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050505;
      --ink: #ffffff;
      --muted: rgba(255, 255, 255, 0.78);
      --line: rgba(255, 255, 255, 0.22);
      --orange: #ff7a00;
      --orange-hot: #ff9a3a;
      --orange-deep: #e45a00;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "Manrope", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      position: relative;
      isolation: isolate;
    }

    .fx {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    #dots,
    .fx-wave,
    .fx-vignette {
      pointer-events: none;
    }

    #dots {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .fx-wave {
      position: absolute;
      top: 0;
      height: 100%;
      width: min(42vw, 520px);
      opacity: 0.95;
    }

    .fx-wave svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .fx-wave--left {
      left: -4%;
      animation: drift-left 18s ease-in-out infinite alternate;
    }

    .fx-wave--right {
      right: -6%;
      animation: drift-right 20s ease-in-out infinite alternate;
    }

    .fx-vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 50% 45%, transparent 30%, rgba(0, 0, 0, 0.55) 100%),
        linear-gradient(90deg, rgba(0, 0, 0, 0.35), transparent 18%, transparent 82%, rgba(0, 0, 0, 0.35));
    }

    @keyframes drift-left {
      from { transform: rotate(-8deg) translateY(0); }
      to { transform: rotate(-5deg) translateY(18px); }
    }

    @keyframes drift-right {
      from { transform: rotate(10deg) translateY(0); }
      to { transform: rotate(7deg) translateY(-14px); }
    }

    main {
      position: relative;
      z-index: 2;
      width: min(920px, calc(100% - 3rem));
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 1.5rem 0;
      pointer-events: none;
    }

    main a {
      pointer-events: auto;
      cursor: pointer;
      position: relative;
      z-index: 3;
    }

    .logo {
      width: clamp(108px, 15vw, 148px);
      height: auto;
      display: block;
      margin-bottom: 1.35rem;
      filter: drop-shadow(0 0 22px rgba(255, 122, 0, 0.4));
      animation: logo-in 0.9s ease-out both;
    }

    .brand {
      margin: 0;
      font-size: clamp(2.6rem, 7vw, 4rem);
      font-weight: 800;
      letter-spacing: 0.1em;
      line-height: 1;
      animation: rise 0.8s 0.08s ease-out both;
    }

    .tag {
      margin: 0.7rem 0 0;
      font-size: clamp(0.78rem, 1.8vw, 0.95rem);
      font-weight: 600;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--muted);
      animation: rise 0.8s 0.14s ease-out both;
    }

    .lede {
      margin: 1.85rem 0 0;
      max-width: 34ch;
      font-size: clamp(1.12rem, 2.6vw, 1.35rem);
      font-weight: 500;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.9);
      animation: rise 0.8s 0.2s ease-out both;
    }

    .go {
      margin-top: 2rem;
      display: inline-flex;
      align-items: center;
      gap: 0.85rem;
      padding: 1.15rem 1.85rem 1.15rem 1.55rem;
      border-radius: 999px;
      text-decoration: none;
      color: #fff;
      font-weight: 700;
      font-size: clamp(1.05rem, 2.4vw, 1.2rem);
      letter-spacing: 0.01em;
      background: linear-gradient(105deg, var(--orange-deep) 0%, var(--orange) 45%, var(--orange-hot) 100%);
      box-shadow:
        0 0 0 1px rgba(255, 180, 80, 0.25),
        0 12px 34px rgba(255, 100, 0, 0.42),
        0 0 48px rgba(255, 122, 0, 0.28);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
      animation: rise 0.8s 0.28s ease-out both;
      -webkit-tap-highlight-color: transparent;
    }

    .go:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
      box-shadow:
        0 0 0 1px rgba(255, 200, 100, 0.35),
        0 16px 40px rgba(255, 100, 0, 0.52),
        0 0 56px rgba(255, 122, 0, 0.34);
    }

    .go:active { transform: translateY(0); }

    .go svg {
      flex-shrink: 0;
      display: block;
    }

    .go .arrow {
      opacity: 0.95;
      transition: transform 0.18s ease;
    }

    .go:hover .arrow { transform: translateX(3px); }

    .contact-head {
      margin-top: 2.75rem;
      width: 100%;
      max-width: 820px;
      display: flex;
      align-items: center;
      gap: 1rem;
      animation: rise 0.8s 0.34s ease-out both;
    }

    .contact-head span {
      flex: 0 0 auto;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.72);
      white-space: nowrap;
    }

    .contact-head::before,
    .contact-head::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--line), transparent);
    }

    .contacts {
      margin-top: 1.25rem;
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      gap: 0.85rem;
      animation: rise 0.8s 0.4s ease-out both;
    }

    .contacts a {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      padding: 0.95rem 0.85rem;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.02);
      color: var(--ink);
      text-decoration: none;
      font-size: clamp(0.78rem, 1.35vw, 0.95rem);
      font-weight: 500;
      letter-spacing: 0.01em;
      white-space: nowrap;
      transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
      -webkit-tap-highlight-color: transparent;
      direction: ltr;
      unicode-bidi: isolate;
    }

    .contacts a:hover {
      border-color: rgba(255, 140, 40, 0.65);
      background: rgba(255, 122, 0, 0.08);
      box-shadow: 0 0 20px rgba(255, 122, 0, 0.12);
    }

    .contacts svg {
      flex-shrink: 0;
      color: var(--orange);
      width: 18px;
      height: 18px;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes logo-in {
      from { opacity: 0; transform: scale(0.88); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 700px) {
      .contacts {
        flex-direction: column;
        max-width: 420px;
      }

      .contacts a {
        white-space: normal;
        font-size: 0.95rem;
        padding: 0.9rem 1rem;
      }
    }

    @media (max-width: 520px) {
      main { width: min(100%, calc(100% - 1.75rem)); }
      .tag { letter-spacing: 0.18em; }
      .go {
        width: 100%;
        max-width: 360px;
        justify-content: center;
        padding: 1.05rem 1.25rem;
        font-size: 1rem;
        gap: 0.65rem;
      }
      .go span { flex: 0 1 auto; }
    }

    @media (max-height: 760px) {
      .logo { width: clamp(88px, 12vw, 118px); margin-bottom: 0.9rem; }
      .brand { font-size: clamp(2.2rem, 6vw, 3.2rem); }
      .lede { margin-top: 1.2rem; font-size: clamp(1rem, 2.2vw, 1.15rem); }
      .go { margin-top: 1.35rem; padding: 0.95rem 1.5rem; }
      .contact-head { margin-top: 1.75rem; }
      .contacts { margin-top: 0.9rem; }
      .contacts a { padding: 0.78rem 0.75rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fx-wave, .logo, .brand, .tag, .lede, .go, .contact-head, .contacts {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="fx" aria-hidden="true">
    <canvas id="dots"></canvas>
    <div class="fx-wave fx-wave--left">
      <svg viewBox="0 0 320 900" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="gL" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffb14a" stop-opacity="0.95" />
            <stop offset="45%" stop-color="#ff7a00" stop-opacity="0.75" />
            <stop offset="100%" stop-color="#ff5a00" stop-opacity="0.15" />
          </linearGradient>
          <filter id="blurL" x="-40%" y="-20%" width="180%" height="140%">
            <feGaussianBlur stdDeviation="10" />
          </filter>
        </defs>
        <path d="M40 40 C120 120, 40 220, 130 300 S40 460, 150 540 S60 700, 140 820" fill="none" stroke="url(#gL)" stroke-width="28" stroke-linecap="round" filter="url(#blurL)" opacity="0.55" />
        <path d="M70 20 C150 110, 60 210, 160 290 S70 450, 180 530 S90 690, 170 800" fill="none" stroke="url(#gL)" stroke-width="4" stroke-linecap="round" opacity="0.9" />
        <path d="M20 120 C90 190, 10 280, 100 360 S20 520, 120 600 S40 760, 110 860" fill="none" stroke="#ff9a3a" stroke-width="2.5" stroke-linecap="round" opacity="0.55" />
      </svg>
    </div>
    <div class="fx-wave fx-wave--right">
      <svg viewBox="0 0 320 900" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="gR" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffb14a" stop-opacity="0.95" />
            <stop offset="45%" stop-color="#ff7a00" stop-opacity="0.75" />
            <stop offset="100%" stop-color="#ff5a00" stop-opacity="0.15" />
          </linearGradient>
          <filter id="blurR" x="-40%" y="-20%" width="180%" height="140%">
            <feGaussianBlur stdDeviation="10" />
          </filter>
        </defs>
        <path d="M280 50 C200 130, 280 230, 190 310 S280 470, 170 550 S260 710, 180 830" fill="none" stroke="url(#gR)" stroke-width="28" stroke-linecap="round" filter="url(#blurR)" opacity="0.55" />
        <path d="M250 30 C170 120, 260 220, 160 300 S250 460, 140 540 S230 700, 150 810" fill="none" stroke="url(#gR)" stroke-width="4" stroke-linecap="round" opacity="0.9" />
        <path d="M300 140 C230 210, 310 300, 220 380 S300 540, 200 620 S280 780, 210 880" fill="none" stroke="#ff9a3a" stroke-width="2.5" stroke-linecap="round" opacity="0.55" />
      </svg>
    </div>
    <div class="fx-vignette"></div>
  </div>

  <main>
    <img class="logo" src="./images/logo.png" width="148" height="148" alt="AIBITDEV" />
    <h1 class="brand">AIBITDEV</h1>
    <p class="tag">Digital development studio</p>
    <p class="lede">We've moved to our new professional website.</p>

    <a class="go" href="https://www.aibitdev.com/" target="_blank" rel="noopener noreferrer">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">

      </svg>
      <span>Visit the official website</span>
      <svg class="arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </a>

    <div class="contact-head"><span>Contact us</span></div>

    <div class="contacts">
      <a href="mailto:aibitdevdz@gmail.com" dir="ltr">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.7" />
          <path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        aibitdevdz@gmail.com
      </a>
      <a href="tel:+213553781225" dir="ltr">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7.5 3.8h3.2l1.2 3.1-2 1.2a12.2 12.2 0 0 0 5 5l1.2-2 3.1 1.2v3.2a1.8 1.8 0 0 1-1.9 1.8C9.6 17.1 3.9 11.4 3.7 5.7A1.8 1.8 0 0 1 5.5 3.8Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
        </svg>
        +213 553 781 225
      </a>
      <a href="https://www.aibitdev.com/" target="_blank" rel="noopener noreferrer" dir="ltr">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7" />
          <path d="M3 12h18M12 3c2.5 2.8 3.8 5.8 3.8 9s-1.3 6.2-3.8 9c-2.5-2.8-3.8-5.8-3.8-9S9.5 5.8 12 3Z" stroke="currentColor" stroke-width="1.7" />
        </svg>
        aibitdev.com
      </a>
    </div>
  </main>

  <script>
    (function () {
      const canvas = document.getElementById("dots");
      const ctx = canvas.getContext("2d");
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const pointer = { x: -9999, y: -9999, active: false };
      const pulses = [];
      let dots = [];
      let w = 0;
      let h = 0;
      let dpr = 1;

      document.querySelectorAll('a[href^="http"]').forEach((link) => {
        link.addEventListener("click", (event) => {
          const href = link.href;
          if (!href) return;
          event.preventDefault();
          window.open(href, "_blank", "noopener,noreferrer");
        });
      });

      function cluster(cx, cy, cols, rows, gap, alpha) {
        const out = [];
        const ox = cx - ((cols - 1) * gap) / 2;
        const oy = cy - ((rows - 1) * gap) / 2;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const nx = (c / Math.max(1, cols - 1)) * 2 - 1;
            const ny = (r / Math.max(1, rows - 1)) * 2 - 1;
            const falloff = 1 - Math.min(1, Math.hypot(nx, ny) * 0.68);
            if (falloff < 0.12) continue;
            out.push({
              bx: ox + c * gap,
              by: oy + r * gap,
              x: ox + c * gap,
              y: oy + r * gap,
              vx: 0,
              vy: 0,
              r: 1.05 + falloff * 0.55,
              a: alpha * (0.3 + falloff * 0.7)
            });
          }
        }
        return out;
      }

      function rebuild() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const gap = Math.max(9, Math.min(13, w * 0.009));
        dots = [
          ...cluster(w * 0.82, h * 0.14, 16, 12, gap, 0.58),
          ...cluster(w * 0.12, h * 0.42, 12, 12, gap, 0.42),
          ...cluster(w * 0.9, h * 0.7, 11, 10, gap, 0.34),
          ...cluster(w * 0.22, h * 0.16, 9, 8, gap * 1.05, 0.28),
          ...cluster(w * 0.5, h * 0.88, 14, 7, gap, 0.26),
          ...cluster(w * 0.08, h * 0.78, 8, 8, gap, 0.22),
          ...cluster(w * 0.72, h * 0.5, 10, 8, gap * 1.1, 0.2)
        ];
      }

      function applyForce(d, x, y, radius, strength) {
        const dx = d.x - x;
        const dy = d.y - y;
        const dist = Math.hypot(dx, dy) || 0.001;
        if (dist >= radius) return { fx: 0, fy: 0 };
        const force = (1 - dist / radius) * strength;
        return { fx: (dx / dist) * force, fy: (dy / dist) * force };
      }

      function forceScale() {
        // Keep the push proportional to the viewport so phones stay gentle.
        return Math.min(1, Math.max(0.42, w / 1100));
      }

      function step() {
        ctx.clearRect(0, 0, w, h);
        const scale = forceScale();
        const radius = Math.min(150, Math.max(56, w * 0.1)) * (0.7 + scale * 0.3);
        const strength = 28 * scale;

        for (let p = pulses.length - 1; p >= 0; p--) {
          pulses[p].life -= w < 700 ? 0.055 : 0.035;
          if (pulses[p].life <= 0) pulses.splice(p, 1);
        }

        for (let i = 0; i < dots.length; i++) {
          const d = dots[i];
          let fx = (d.bx - d.x) * 0.1;
          let fy = (d.by - d.y) * 0.1;

          if (pointer.active) {
            const push = applyForce(d, pointer.x, pointer.y, radius, strength);
            fx += push.fx;
            fy += push.fy;
          }

          for (let p = 0; p < pulses.length; p++) {
            const pulse = pulses[p];
            const push = applyForce(d, pulse.x, pulse.y, radius, strength * pulse.life);
            fx += push.fx;
            fy += push.fy;
          }

          d.vx = (d.vx + fx) * 0.78;
          d.vy = (d.vy + fy) * 0.78;
          d.x += d.vx;
          d.y += d.vy;

          ctx.beginPath();
          ctx.fillStyle = "rgba(255,255,255," + d.a + ")";
          ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
          ctx.fill();
        }

        requestAnimationFrame(step);
      }

      function setPointer(x, y, active) {
        pointer.x = x;
        pointer.y = y;
        pointer.active = active;
      }

      function addPulse(x, y) {
        pulses.push({ x: x, y: y, life: w < 700 ? 0.7 : 1 });
      }

      function onMove(event) {
        setPointer(event.clientX, event.clientY, true);
      }

      function onDown(event) {
        setPointer(event.clientX, event.clientY, true);
        addPulse(event.clientX, event.clientY);
      }

      function onUp() {
        pointer.active = false;
      }

      function onLeave() {
        pointer.active = false;
      }

      rebuild();
      window.addEventListener("resize", rebuild);

      if (reduce) {
        ctx.clearRect(0, 0, w, h);
        for (let i = 0; i < dots.length; i++) {
          const d = dots[i];
          ctx.beginPath();
          ctx.fillStyle = "rgba(255,255,255," + d.a + ")";
          ctx.arc(d.bx, d.by, d.r, 0, Math.PI * 2);
          ctx.fill();
        }
        return;
      }

      window.addEventListener("pointermove", onMove, { passive: true });
      window.addEventListener("pointerdown", onDown, { passive: true });
      window.addEventListener("pointerup", onUp, { passive: true });
      window.addEventListener("pointercancel", onUp, { passive: true });
      window.addEventListener("pointerleave", onLeave);
      requestAnimationFrame(step);
    })();
  </script>
</body>
</html>
